<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a24;
    --border: #2a3548;
    --text: #dbe4f0;
    --accent: #f0b429;
    --accent2: #4da3ff;
    --danger: #e5533d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2536 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 4px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 14px rgba(240, 180, 41, .35);
  }
  .hud {
    display: flex;
    gap: 18px;
    font-size: 13px;
    color: #9fb0c8;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
  }
  .hud b { color: var(--text); font-variant-numeric: tabular-nums; }
  .stage {
    position: relative;
    border: 2px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    background: #000;
  }
  canvas { display: block; border-radius: 4px; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(8, 10, 16, .82);
    border-radius: 4px;
    text-align: center;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .title-big { font-size: 34px; font-weight: 800; letter-spacing: 3px; color: var(--accent); }
  .sub { color: #9fb0c8; font-size: 14px; line-height: 1.7; max-width: 360px; }
  .keys { display: inline-block; color: #0b0e14; background: var(--accent2); border-radius: 4px; padding: 1px 8px; font-weight: 700; }
  .btn {
    cursor: pointer;
    border: none;
    background: linear-gradient(180deg, #f3c242, #d89a1e);
    color: #231a04;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 10px 34px;
    border-radius: 6px;
    box-shadow: 0 4px 0 #a8740f;
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a8740f; }
  .hint { color: #6c7c94; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>坦克大战</h1>
  <div class="hud">
    <span>生命 <b id="lives">3</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>关卡 <b id="level">1</b></span>
    <span>敌军 <b id="enemies">0</b></span>
  </div>

  <div class="stage">
    <canvas id="game" width="520" height="520"></canvas>
    <div class="overlay" id="startOverlay">
      <div class="title-big">坦克大战</div>
      <div class="sub">
        方向键 <span class="keys">W A S D</span> 或 <span class="keys">↑ ← ↓ →</span> 移动<br>
        <span class="keys">空格</span> 开火 &nbsp;·&nbsp; <span class="keys">P</span> 暂停<br>
        保护基地 <span style="color:#e5533d">★</span>，消灭所有敌军！
      </div>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <div class="overlay hidden" id="overOverlay">
      <div class="title-big" id="overTitle">游戏结束</div>
      <div class="sub" id="overSub"></div>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
    <div class="overlay hidden" id="pauseOverlay">
      <div class="title-big">已暂停</div>
      <div class="sub">按 <span class="keys">P</span> 继续</div>
    </div>
  </div>
  <div class="hint">支持键盘操作 · 经典 Battle City 玩法</div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const CELL = 26;                 // 网格单元尺寸
  const COLS = 20, ROWS = 20;      // 地图网格
  const TANK = 24;                 // 坦克尺寸（略小于单元）
  const BULLET = 5;                // 子弹尺寸

  const elLives = document.getElementById("lives");
  const elScore = document.getElementById("score");
  const elLevel = document.getElementById("level");
  const elEnemies = document.getElementById("enemies");
  const startOverlay = document.getElementById("startOverlay");
  const overOverlay = document.getElementById("overOverlay");
  const pauseOverlay = document.getElementById("pauseOverlay");
  const overTitle = document.getElementById("overTitle");
  const overSub = document.getElementById("overSub");

  // ---------- 常量 ----------
  const DIR = {
    UP:    { x: 0,  y: -1, a: -Math.PI / 2 },
    DOWN:  { x: 0,  y:  1, a:  Math.PI / 2 },
    LEFT:  { x: -1, y:  0, a:  Math.PI },
    RIGHT: { x: 1,  y:  0, a:  0 },
  };
  const DIRS = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];

  const PLAYER_SPEED = 110;       // px/s
  const ENEMY_SPEED  = 60;
  const BULLET_SPEED = 320;

  // 地图元素
  const E = { EMPTY: 0, BRICK: 1, STEEL: 2, WATER: 3, TREE: 4, BASE: 5 };

  // 经典地图（20x20）
  const LEVEL_MAP = [
    "00000000000000000000",
    "01100011000011000110",
    "01100011000011000110",
    "02200022000022000220",
    "03301111111111110330",
    "03300000000000000330",
    "00000110011001100000",
    "00000110011001100000",
    "00220010000001002200",
    "00110010000001001100",
    "00110010000001001100",
    "00220010000001002200",
    "00000110011001100000",
    "00000110011001100000",
    "03300000000000000330",
    "03301111111111110330",
    "02200022000022000220",
    "01100011000011000110",
    "01100011000011000110",
    "00000000050000000000",
  ];

  // ---------- 游戏状态 ----------
  let map = [];          // 二维数组
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let score = 0;
  let lives = 3;
  let level = 1;
  let spawnQueue = [];
  let spawnTimer = 0;
  let baseAlive = true;
  let gameState = "menu"; // menu | playing | paused | over
  let keys = {};
  let lastTime = 0;
  let freezeTimer = 0;    // 死亡后的冻结时间

  // ---------- 地图 ----------
  function loadLevel() {
    map = LEVEL_MAP.map(row => row.split("").map(Number));
    // 基地用钢铁包边
    const by = ROWS - 1, bx = 9;
    map[by][bx] = E.BASE;
  }

  // ---------- 工具 ----------
  function rect(x, y, w, h) { return { x, y, w, h }; }
  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function cellAt(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return E.STEEL;
    return map[row][col];
  }

  // 坦克矩形
  function tankRect(t) {
    return rect(t.x - TANK / 2, t.y - TANK / 2, TANK, TANK);
  }

  // 检查坦克能否移动到指定位置（碰撞墙体 + 边界 + 其他坦克）
  function canMove(t, nx, ny, ignore) {
    const r = rect(nx - TANK / 2, ny - TANK / 2, TANK, TANK);
    if (r.x < 0 || r.y < 0 || r.x + r.w > canvas.width || r.y + r.h > canvas.height) return false;

    // 与墙体碰撞
    const c0 = Math.floor(r.x / CELL), c1 = Math.floor((r.x + r.w - 0.001) / CELL);
    const r0 = Math.floor(r.y / CELL), r1 = Math.floor((r.y + r.h - 0.001) / CELL);
    for (let row = r0; row <= r1; row++) {
      for (let col = c0; col <= c1; col++) {
        const e = cellAt(col, row);
        if (e === E.BRICK || e === E.STEEL || e === E.WATER || e === E.BASE) return false;
      }
    }
    // 与其他坦克碰撞
    const all = [player, ...enemies].filter(Boolean);
    for (const o of all) {
      if (o === t || o === ignore) continue;
      if (overlaps(r, tankRect(o))) return false;
    }
    return true;
  }

  // ---------- 坦克对象 ----------
  function createTank(x, y, dir, opts) {
    return {
      x, y, dir,
      speed: opts.speed || PLAYER_SPEED,
      isPlayer: !!opts.isPlayer,
      color: opts.color || "#f0b429",
      cooldown: 0,
      aiDirTimer: 0,
      respawn: 0,       // 复活无敌时间
      flash: 0,
    };
  }

  // ---------- 子弹 ----------
  function shoot(t) {
    if (t.cooldown > 0) return;
    const tipX = t.x + Math.cos(t.dir.a) * (TANK / 2 + 3);
    const tipY = t.y + Math.sin(t.dir.a) * (TANK / 2 + 3);
    bullets.push({
      x: tipX, y: tipY,
      dx: Math.cos(t.dir.a), dy: Math.sin(t.dir.a),
      speed: BULLET_SPEED,
      fromPlayer: t.isPlayer,
      strong: t.isPlayer && score >= 0, // 未来可扩展
      alive: true,
    });
    t.cooldown = t.isPlayer ? 0.18 : 0.5;
    if (t.isPlayer) sfx.shoot();
  }

  // ---------- 粒子特效 ----------
  function spawnParticles(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.4, age: 0, color, size: 2 + Math.random() * 3,
      });
    }
  }
  function explosion(x, y, color) {
    spawnParticles(x, y, color, 18);
    spawnParticles(x, y, "#ffffff", 6);
  }

  // ---------- 音效（简易 WebAudio） ----------
  const sfx = (() => {
    let ctxa = null;
    function ensure() { if (!ctxa) ctxa = new (window.AudioContext || window.webkitAudioContext)(); return ctxa; }
    function beep(freq, dur, type = "square", vol = 0.06) {
      try {
        const c = ensure();
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.value = vol;
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + dur);
      } catch (e) {}
    }
    return {
      shoot() { beep(600, 0.08, "square", 0.05); },
      hit()   { beep(180, 0.15, "sawtooth", 0.08); },
      explode(){ beep(90, 0.35, "sawtooth", 0.12); },
      die()   { beep(120, 0.5, "triangle", 0.1); },
      win()   { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => beep(f, 0.15, "square", 0.07), i * 120)); },
    };
  })();

  // ---------- 敌人生成 ----------
  function buildSpawnQueue() {
    const total = 4 + level * 2; // 敌军数量随关卡增长
    spawnQueue = [];
    for (let i = 0; i < total; i++) {
      spawnQueue.push({
        color: i % 4 === 3 ? "#e5533d" : (i % 2 ? "#8fb3d9" : "#c9d2dd"),
        speed: ENEMY_SPEED + Math.min(level * 4, 40),
      });
    }
    updateHud();
  }

  function spawnEnemy() {
    const spawnPoints = [
      { x: 1.5 * CELL, y: 1.5 * CELL },
      { x: (COLS - 2.5) * CELL, y: 1.5 * CELL },
      { x: (COLS / 2 - 0.5) * CELL, y: 1.5 * CELL },
    ];
    const cfg = spawnQueue.shift();
    if (!cfg) return;
    const p = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
    const dir = DIR.DOWN;
    // 找一个能放下坦克的位置
    for (const sp of spawnPoints) {
      const t = createTank(sp.x, sp.y, dir, { speed: cfg.speed, color: cfg.color });
      if (canMove(t, sp.x, sp.y)) { enemies.push(t); return; }
    }
  }

  // ---------- 玩家 ----------
  function spawnPlayer() {
    player = createTank(CELL * 4.5, (ROWS - 1.5) * CELL, DIR.UP, { isPlayer: true });
    player.respawn = 2; // 出生无敌
  }

  // ---------- 关卡流程 ----------
  function startGame() {
    loadLevel();
    score = 0; lives = 3; level = 1;
    bullets = []; particles = [];
    baseAlive = true;
    buildSpawnQueue();
    spawnPlayer();
    spawnTimer = 0.5;
    setState("playing");
    updateHud();
  }

  function nextLevel() {
    level++;
    loadLevel();
    bullets = []; particles = [];
    baseAlive = true;
    buildSpawnQueue();
    spawnPlayer();
    spawnTimer = 0.5;
    updateHud();
  }

  function setState(s) {
    gameState = s;
    startOverlay.classList.toggle("hidden", s !== "menu");
    overOverlay.classList.toggle("hidden", s !== "over");
    pauseOverlay.classList.toggle("hidden", s !== "paused");
  }

  function updateHud() {
    elLives.textContent = lives;
    elScore.textContent = score;
    elLevel.textContent = level;
    elEnemies.textContent = enemies.length + spawnQueue.length;
  }

  // ---------- 更新逻辑 ----------
  function update(dt) {
    if (gameState !== "playing") return;

    freezeTimer = Math.max(0, freezeTimer - dt);
    if (freezeTimer > 0) {
      // 冻结期间仅更新粒子与子弹
      updateBullets(dt);
      updateParticles(dt);
      return;
    }

    // 玩家移动
    if (player) {
      player.cooldown = Math.max(0, player.cooldown - dt);
      player.respawn = Math.max(0, player.respawn - dt);
      player.flash = Math.max(0, player.flash - dt);
      let dx = 0, dy = 0, wantDir = player.dir;
      if (keys["w"] || keys["arrowup"])    { dy = -1; wantDir = DIR.UP; }
      else if (keys["s"] || keys["arrowdown"]) { dy = 1; wantDir = DIR.DOWN; }
      else if (keys["a"] || keys["arrowleft"]) { dx = -1; wantDir = DIR.LEFT; }
      else if (keys["d"] || keys["arrowright"]){ dx = 1;  wantDir = DIR.RIGHT; }

      if (dx || dy) {
        player.dir = wantDir;
        const nx = player.x + dx * player.speed * dt;
        const ny = player.y + dy * player.speed * dt;
        if (canMove(player, nx, ny)) { player.x = nx; player.y = ny; }
        else if (canMove(player, nx, player.y)) player.x = nx;
        else if (canMove(player, player.x, ny)) player.y = ny;
      }
      if (keys[" "]) shoot(player);
    }

    // 敌人生成
    spawnTimer -= dt;
    if (spawnTimer <= 0 && spawnQueue.length > 0) {
      spawnEnemy();
      spawnTimer = 2.2;
    }

    // 敌人 AI
    for (const e of enemies) {
      e.cooldown = Math.max(0, e.cooldown - dt);
      e.respawn = Math.max(0, e.respawn - dt);
      e.aiDirTimer -= dt;
      // 随机转向
      if (e.aiDirTimer <= 0) {
        e.aiDirTimer = 0.6 + Math.random() * 1.6;
        // 一定概率朝玩家或基地方向
        if (Math.random() < 0.4 && player) {
          const dxp = player.x - e.x, dyp = player.y - e.y;
          if (Math.abs(dxp) > Math.abs(dyp)) e.dir = dxp > 0 ? DIR.RIGHT : DIR.LEFT;
          else e.dir = dyp > 0 ? DIR.DOWN : DIR.UP;
        } else {
          e.dir = DIRS[Math.floor(Math.random() * 4)];
        }
      }
      // 移动，撞墙转向
      const nx = e.x + e.dir.x * e.speed * dt;
      const ny = e.y + e.dir.y * e.speed * dt;
      if (canMove(e, nx, ny)) {
        e.x = nx; e.y = ny;
      } else {
        e.dir = DIRS[Math.floor(Math.random() * 4)];
        e.aiDirTimer = 0.5;
      }
      // 开火
      if (Math.random() < dt * 0.8) shoot(e);
    }

    updateBullets(dt);
    updateParticles(dt);
    checkWin();
    updateHud();
  }

  function updateBullets(dt) {
    for (const b of bullets) {
      if (!b.alive) continue;
      b.x += b.dx * b.speed * dt;
      b.y += b.dy * b.speed * dt;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x > canvas.width || b.y > canvas.height) { b.alive = false; continue; }

      // 与墙碰撞
      const col = Math.floor(b.x / CELL), row = Math.floor(b.y / CELL);
      const e = cellAt(col, row);
      if (e === E.BRICK) {
        map[row][col] = E.EMPTY;
        spawnParticles(col * CELL + CELL / 2, row * CELL + CELL / 2, "#c07a3a", 8);
        b.alive = false; sfx.hit(); continue;
      } else if (e === E.STEEL) {
        spawnParticles(b.x, b.y, "#9aa7b8", 6);
        b.alive = false; sfx.hit(); continue;
      } else if (e === E.BASE) {
        destroyBase(); b.alive = false; continue;
      }

      // 与坦克碰撞
      const targets = b.fromPlayer ? enemies : (player ? [player] : []);
      for (const t of targets) {
        if (!t) continue;
        if (overlaps(rect(b.x - BULLET / 2, b.y - BULLET / 2, BULLET, BULLET), tankRect(t))) {
          b.alive = false;
          if (t.isPlayer) { killPlayer(); }
          else { destroyEnemy(t); }
          break;
        }
      }

      // 子弹互相抵消（简化：双方子弹相遇）
      if (b.alive) {
        for (const o of bullets) {
          if (o === b || !o.alive || o.fromPlayer === b.fromPlayer) continue;
          if (overlaps(rect(b.x, b.y, 3, 3), rect(o.x, o.y, 3, 3))) {
            b.alive = false; o.alive = false;
            spawnParticles((b.x + o.x) / 2, (b.y + o.y) / 2, "#ffffff", 6);
            break;
          }
        }
      }
    }
    bullets = bullets.filter(b => b.alive);
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
    }
    particles = particles.filter(p => p.age < p.life);
  }

  function destroyEnemy(t) {
    explosion(t.x, t.y, "#ff7a4d");
    enemies = enemies.filter(e => e !== t);
    score += 100;
    sfx.explode();
    updateHud();
  }

  function killPlayer() {
    explosion(player.x, player.y, "#f0b429");
    lives--;
    sfx.die();
    updateHud();
    if (lives <= 0) {
      player = null;
      gameOver(false);
      return;
    }
    player = null;
    freezeTimer = 1.0;
    setTimeout(() => { if (gameState === "playing" && !player) spawnPlayer(); }, 1000);
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    const bx = 9, by = ROWS - 1;
    explosion(bx * CELL + CELL / 2, by * CELL + CELL / 2, "#e5533d");
    map[by][bx] = E.EMPTY;
    sfx.explode();
    gameOver(false);
  }

  function checkWin() {
    if (enemies.length === 0 && spawnQueue.length === 0 && gameState === "playing") {
      score += 500;
      sfx.win();
      setTimeout(() => { if (gameState === "playing") nextLevel(); }, 1200);
    }
  }

  function gameOver(won) {
    setState("over");
    overTitle.textContent = won ? "胜利！" : "游戏结束";
    overTitle.style.color = won ? "#7fe07f" : "#e5533d";
    overSub.textContent = won
      ? `恭喜通关第 ${level} 关！最终得分 ${score}`
      : `你坚持到了第 ${level} 关，得分 ${score}`;
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 地图
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const e = map[row][col];
        const x = col * CELL, y = row * CELL;
        if (e === E.EMPTY) continue;
        if (e === E.BRICK) drawBrick(x, y);
        else if (e === E.STEEL) drawSteel(x, y);
        else if (e === E.WATER) drawWater(x, y);
        else if (e === E.TREE) drawTree(x, y);
        else if (e === E.BASE) drawBase(x, y);
      }
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // 子弹
    for (const b of bullets) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = b.fromPlayer ? "#ffe066" : "#ff9a66";
      ctx.shadowColor = b.fromPlayer ? "#ffe066" : "#ff7a4d";
      ctx.shadowBlur = 6;
      ctx.fillRect(-BULLET / 2, -BULLET / 2, BULLET, BULLET);
      ctx.restore();
    }

    // 敌人
    for (const e of enemies) {
      if (e.respawn > 0 && Math.floor(e.respawn * 10) % 2 === 0) continue; // 无敌闪烁
      drawTank(e, e.color, "#2a2f38");
    }

    // 玩家
    if (player) {
      if (player.respawn > 0 && Math.floor(player.respawn * 10) % 2 === 0) {
        // 闪烁
      } else {
        drawTank(player, "#f0b429", "#7a5a10");
      }
    }

    // 草丛（画在最上层遮挡）
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        if (map[row][col] === E.TREE) drawTree(col * CELL, row * CELL);
      }
    }
  }

  function drawBrick(x, y) {
    ctx.fillStyle = "#a84e2a";
    ctx.fillRect(x, y, CELL, CELL);
    ctx.strokeStyle = "#5c2412";
    ctx.lineWidth = 1;
    for (let i = 0; i < 2; i++) {
      const yy = y + i * (CELL / 2);
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + CELL, yy); ctx.stroke();
    }
    for (let i = 0; i < 2; i++) {
      const xx = x + i * (CELL / 2);
      ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx, y + CELL); ctx.stroke();
    }
  }

  function drawSteel(x, y) {
    ctx.fillStyle = "#8a97a6";
    ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = "#c6d0da";
    ctx.fillRect(x + 3, y + 3, CELL - 6, CELL - 6);
    ctx.fillStyle = "#5f6a76";
    ctx.fillRect(x + 6, y + 6, CELL - 12, CELL - 12);
  }

  function drawWater(x, y) {
    ctx.fillStyle = "#1f6f9e";
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = "#2f8fc4";
    const off = (performance.now() / 300) % CELL;
    for (let i = -1; i < 3; i++) {
      const yy = y + i * 8 + off;
      ctx.fillRect(x, yy, CELL, 3);
    }
  }

  function drawTree(x, y) {
    ctx.fillStyle = "rgba(40, 120, 60, 0.85)";
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = "rgba(60, 160, 80, 0.9)";
    ctx.beginPath();
    ctx.arc(x + CELL / 2, y + CELL / 2, CELL * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBase(x, y) {
    ctx.fillStyle = "#2a2f38";
    ctx.fillRect(x, y, CELL, CELL);
    // 星星
    ctx.fillStyle = "#e5533d";
    drawStar(x + CELL / 2, y + CELL / 2, 5, 9, 4);
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    let rot = -Math.PI / 2;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = rot + (i * Math.PI) / spikes;
      const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawTank(t, body, dark) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.dir.a);

    // 履带
    ctx.fillStyle = dark;
    ctx.fillRect(-TANK / 2, -TANK / 2, 6, TANK);
    ctx.fillRect(TANK / 2 - 6, -TANK / 2, 6, TANK);
    // 车身
    ctx.fillStyle = body;
    ctx.fillRect(-TANK / 2 + 6, -TANK / 2 + 3, TANK - 12, TANK - 6);
    // 炮塔
    ctx.fillStyle = lighten(body);
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    // 炮管
    ctx.fillStyle = dark;
    ctx.fillRect(-2, -TANK / 2 - 4, 4, 10);

    ctx.restore();
  }

  function lighten(hex) {
    const c = hex.replace("#", "");
    const n = parseInt(c, 16);
    let r = (n >> 16) + 30, g = ((n >> 8) & 0xff) + 30, b = (n & 0xff) + 30;
    r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
    return `rgb(${r},${g},${b})`;
  }

  // ---------- 主循环 ----------
  function loop(t) {
    const dt = Math.min(0.05, (t - lastTime) / 1000 || 0);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === " " ) e.preventDefault();
    if ((k === "p") && (gameState === "playing" || gameState === "paused")) {
      setState(gameState === "playing" ? "paused" : "playing");
    }
    if (k === "enter" || k === "r") {
      if (gameState === "menu" || gameState === "over") startGame();
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  // ---------- 启动 ----------
  loadLevel();
  setState("menu");
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
